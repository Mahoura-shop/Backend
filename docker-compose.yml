services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_REGISTRY_IMAGE:-mahoura/backend}
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${DB_PORT}:5432
    volumes:
      - ./db_prod_data:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: db_test
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: mahouradb_test
    ports:
      - "5433:5432"
    volumes:
      - ./db_test_data:/var/lib/postgresql/data

  db_e2e:
    image: postgres:16
    container_name: db_e2e
    restart: unless-stopped
    profiles: ["e2e"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: e2e_test_db
    ports:
      - "5434:5432"
    volumes:
      - ./db_e2e_data:/var/lib/postgresql/data

  app_e2e:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_e2e
    restart: unless-stopped
    profiles: ["e2e"]
    env_file:
      - ./.env.e2e
    ports:
      - "8081:8081"
    volumes:
      - /internal/infrastructure/jwt
    depends_on:
      - db_e2e
      - redis

  redis:
    image: redis:7
    container_name: redis-db
    restart: unless-stopped
    ports:
      - "${RDB_PORT}:${RDB_PORT}"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${RDB_PASSWORD}"
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      - db

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
