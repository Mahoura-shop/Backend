name: CD

on:
  push:
    branches:
      - main
      - 'ops/**'

jobs:
  notify_start:
    name: Notify CD Start
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          SHA="${{ github.sha }}"
          TEXT="2️⃣ Backend CD Started 2️⃣\nBranch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: [notify_start]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write env and JWT keys
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > .env
          mkdir -p internal/infrastructure/jwt
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > internal/infrastructure/jwt/privateKey.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > internal/infrastructure/jwt/publicKey.pem
          chmod 600 internal/infrastructure/jwt/*.pem

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        env:
          BACKEND_REGISTRY_IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}
        run: |
          docker compose build app 2>&1 | tee /tmp/backend_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            tail -n 30 /tmp/backend_build.log
            exit $BUILD_EXIT
          fi

      - name: Push backend image
        env:
          BACKEND_REGISTRY_IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}
        run: docker compose push app

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,monitoring"
          target: "/root/mahoura/backend"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          BACKEND_REGISTRY_IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_ENV,BACKEND_REGISTRY_IMAGE,GHCR_USERNAME,GHCR_PAT
          script: |
            cd /root/mahoura/backend
            echo "$BACKEND_ENV" > .env
            chmod 644 .env
            export BACKEND_REGISTRY_IMAGE=$BACKEND_REGISTRY_IMAGE
            echo "$GHCR_PAT" | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
            docker compose pull app
            docker compose down --remove-orphans
            docker compose up -d
            docker image prune -f

      - name: Notify
        if: always()
        env:
          STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          SHA="${{ github.sha }}"
          INFO="Branch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          if [ "$STATUS" = "success" ]; then
            TEXT="🔴✅ Backend Deploy Successful ✅🔴\n${INFO}"
          else
            TEXT="🔴❌ Backend Deploy Failed ❌🔴\n${INFO}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
