name: CD

on:
  push:
    branches: ['**']

jobs:
  notify_cd_start:
    name: Notify CD Start
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/ops/') ||
      startsWith(github.event.head_commit.message, 'cd')
    steps:
      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          COMMIT_INFO="Branch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          TEXT="🔴2️⃣ Backend CD Started 2️⃣🔴\n${COMMIT_INFO}"
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  build_and_push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [notify_cd_start]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Write env and JWT keys
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > .env
          mkdir -p internal/infrastructure/jwt
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > internal/infrastructure/jwt/privateKey.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > internal/infrastructure/jwt/publicKey.pem
          chmod 600 internal/infrastructure/jwt/*.pem

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          BACKEND_REGISTRY_IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}
        run: |
          mkdir -p .build-output
          docker compose build app 2>&1 | tee .build-output/raw_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          sed -r "s/\x1B\[[0-9;]*[JKmsu]//g" .build-output/raw_build.log | tail -n 50 > .build-output/build_output.log || \
            tail -n 50 .build-output/raw_build.log > .build-output/build_output.log
          exit $BUILD_EXIT

      - name: Push image
        env:
          BACKEND_REGISTRY_IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}
        run: docker compose push app

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-output
          path: .build-output/
          retention-days: 1

  notify_build_failure:
    name: Notify Build Failure
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: always() && needs.build_and_push.result == 'failure'
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: backend-build-output
          path: .build-output/
        continue-on-error: true

      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          COMMIT_INFO="Branch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          MESSAGE=$(cat .build-output/build_output.log 2>/dev/null || echo "No output captured")
          TEXT="🔴❌ Backend Build Failed ❌🔴\n${COMMIT_INFO}\n\nError details:\n${MESSAGE}"
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  notify_build_success:
    name: Notify Build Success
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: always() && needs.build_and_push.result == 'success'
    steps:
      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          COMMIT_INFO="Branch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          TEXT="🔴✅ Backend Build Successful ✅🔴\n${COMMIT_INFO}"
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: always() && needs.build_and_push.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,monitoring"
          target: "/root/mahoura/backend"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          BACKEND_REGISTRY_IMAGE: ${{ secrets.BACKEND_REGISTRY_IMAGE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_ENV,BACKEND_REGISTRY_IMAGE,GHCR_USERNAME,GHCR_PAT
          script: |
            cd /root/mahoura/backend
            echo "$BACKEND_ENV" > .env
            chmod 644 .env
            export BACKEND_REGISTRY_IMAGE=$BACKEND_REGISTRY_IMAGE
            echo "$GHCR_PAT" | docker login ghcr.io -u $GHCR_USERNAME --password-stdin
            docker compose pull app
            docker compose down --remove-orphans
            docker compose up -d
            docker image prune -f

  notify_deploy_failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    steps:
      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          COMMIT_INFO="Branch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          TEXT="🔴❌ Backend Deploy Failed ❌🔴\n${COMMIT_INFO}"
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  notify_deploy_success:
    name: Notify Deploy Success
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          COMMIT_INFO="Branch: ${{ github.ref_name }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          TEXT="🔴✅ Backend Deploy Successful ✅🔴\n${COMMIT_INFO}"
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
