name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']

jobs:
  notify_ci_start:
    name: Notify CI Start
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      startsWith(github.ref, 'refs/heads/ops/') ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci'))
    steps:
      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          COMMIT_INFO="Branch: ${BRANCH} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          TEXT=$(printf '1️⃣ Backend CI Started 1️⃣\n%s' "${COMMIT_INFO}")
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [notify_ci_start]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: go.sum

      - name: Write JWT keys
        run: |
          mkdir -p internal/infrastructure/jwt
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > internal/infrastructure/jwt/privateKey.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > internal/infrastructure/jwt/publicKey.pem

      - name: Download dependencies
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
        run: go mod download

      - name: Run tests
        run: |
          mkdir -p .test-output
          go test ./... -coverprofile=coverage.out 2>&1 | tee .test-output/raw_test_output.log
          TEST_EXIT=${PIPESTATUS[0]}
          sed -r "s/\x1B\[[0-9;]*[JKmsu]//g" .test-output/raw_test_output.log > .test-output/test_output.log || \
            cp .test-output/raw_test_output.log .test-output/test_output.log
          exit $TEST_EXIT

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: .test-output/
          retention-days: 1

  notify_test_failure:
    name: Notify Test Failure
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.result == 'failure'
    steps:
      - name: Download test output
        uses: actions/download-artifact@v4
        with:
          name: backend-test-output
          path: .test-output/
        continue-on-error: true

      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          COMMIT_INFO="Branch: ${BRANCH} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          MESSAGE=$(tail -n 30 .test-output/test_output.log 2>/dev/null || echo "No output captured")
          TEXT=$(printf '🔴❌ Backend Tests Failed ❌🔴\n%s\n\nError details:\n%s' "${COMMIT_INFO}" "${MESSAGE}")
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true

  notify_test_success:
    name: Notify Test Success
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.result == 'success'
    steps:
      - name: Send notification
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          SHA="${{ github.sha }}"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          COMMIT_INFO="Branch: ${BRANCH} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          TEXT=$(printf '🔴✅ Backend Tests Passed ✅🔴\n%s' "${COMMIT_INFO}")
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
