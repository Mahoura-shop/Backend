name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: go.sum

      - name: Write JWT keys
        run: |
          mkdir -p internal/infrastructure/jwt
          echo "${{ secrets.JWT_PRIVATE_KEY }}" > internal/infrastructure/jwt/privateKey.pem
          echo "${{ secrets.JWT_PUBLIC_KEY }}" > internal/infrastructure/jwt/publicKey.pem

      - name: Download dependencies
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "off"
        run: go mod download

      - name: Run tests
        run: |
          mkdir -p .test-output
          go test ./... -coverprofile=coverage.out 2>&1 | tee .test-output/test_output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: .test-output/
          retention-days: 3

      - name: Notify
        if: always()
        env:
          STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          SHA="${{ github.sha }}"
          INFO="Branch: ${{ github.head_ref }} | Author: ${{ github.actor }} | SHA: ${SHA:0:7}"
          if [ "$STATUS" = "success" ]; then
            TEXT="✅ Backend Tests Passed ✅\n${INFO}"
          else
            TEXT="❌ Backend Tests Failed ❌\n${INFO}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
          curl -s -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${BALE_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "disable_web_page_preview=true" > /dev/null || true
